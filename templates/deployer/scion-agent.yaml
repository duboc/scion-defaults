schema_version: "1"
description: "Release engineer of the ${BUILD_PROJECT} factory (Claude Code). Deploys to ${SANDBOX_PROJECT} as ${DEPLOYER_SA}. Reports to lead."
default_harness_config: claude
agent_instructions: agents.md
system_prompt: system-prompt.md
env:
  FACTORY_ROLE: deployer
  GCP_SANDBOX_PROJECT: "${SANDBOX_PROJECT}"
  CLOUDSDK_CORE_PROJECT: "${SANDBOX_PROJECT}"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
# The Hub injects SCION_TELEMETRY_ENABLED from its own settings and that currently wins over this block
# (lessons-learned.md L6). It is kept so the opt-out applies once Scion honors template-level telemetry.
telemetry:
  enabled: false
# The sandbox identity is not part of the template: assign ${DEPLOYER_SA} to this agent in the Hub (GCP identity
# mode "assign"); see setup-runbook.md.
