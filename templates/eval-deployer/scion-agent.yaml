schema_version: "1"
description: "Dashboard release engineer of the ${EVAL_PROJECT} factory (Antigravity). Deploys ${DASHBOARD_SERVICE} as ${DEPLOYER_SA}. Reports to eval-lead."
default_harness_config: antigravity
model: "Gemini 4 Argon (High)"
agent_instructions: agents.md
system_prompt: system-prompt.md
env:
  FACTORY_ROLE: eval-deployer
  CLOUDSDK_CORE_PROJECT: "${SANDBOX_PROJECT}"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
# Antigravity agents need the telemetry-free hook command (scripts/patch-antigravity-hooks.py): this block alone does
# not help, because the Hub-injected SCION_TELEMETRY_ENABLED wins over it today (lessons-learned.md L6).
telemetry:
  enabled: false
# Assign ${DEPLOYER_SA} to this agent in the Hub (GCP identity mode "assign"); see setup-runbook.md.
