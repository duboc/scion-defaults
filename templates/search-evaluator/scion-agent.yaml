schema_version: "1"
description: "Search quality and latency evaluator of the ${EVAL_PROJECT} factory (Antigravity). Reports to ${EVAL_LEAD_AGENT}."
default_harness_config: ${ANTIGRAVITY_HARNESS}
model: "Gemini 4 Argon (High)"
agent_instructions: agents.md
system_prompt: system-prompt.md
env:
  FACTORY_ROLE: search-evaluator
  FACTORY_SUBDIR: "${FACTORY_SUBDIR}"   # product folder the harness starts in (factory-cd.sh)
# Antigravity agents need the telemetry-free hook command (scripts/patch-antigravity-hooks.py): this block alone does
# not help, because the Hub-injected SCION_TELEMETRY_ENABLED wins over it today (lessons-learned.md L6).
telemetry:
  enabled: false
