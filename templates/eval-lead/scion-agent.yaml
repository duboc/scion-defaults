schema_version: "1"
description: "Evaluation and observability lead of the ${EVAL_PROJECT} factory (Antigravity). Watches and measures the ${BUILD_PROJECT} factory."
# To run the eval lead on Claude Code instead, set `default_harness_config: claude` (see operations-runbook.md,
# "Switch an agent's harness").
default_harness_config: antigravity
model: "Gemini 4 Argon (High)"
agent_instructions: agents.md
system_prompt: system-prompt.md
env:
  FACTORY_ROLE: eval-lead
# Antigravity agents need the telemetry-free hook command (scripts/patch-antigravity-hooks.py): this block alone does
# not help, because the Hub-injected SCION_TELEMETRY_ENABLED wins over it today (lessons-learned.md L6).
telemetry:
  enabled: false
