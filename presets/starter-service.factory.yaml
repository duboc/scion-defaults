project:
  name: Pulse Ledger
  slug: pulse-ledger
  eval_slug: pulse-ledger-eval
  mission: Build an idempotent double-entry transaction ledger API with real-time anomaly detection and audit trail
    verification.
  non_goals:
  - Consumer-facing mobile apps
  - External payment gateway settlement
vcs:
  enabled: true
  provider: github
  repo: example-org/pulse-ledger
  build_branch: main
  eval_branch: eval-dashboard
knowledge_plane:
  root: knowledge-plane
  sources:
    requirements: []
    adrs: []
    contracts: []
    design: []
    guides: []
  requirements:
  - id: REQ-001
    title: Double-entry posting with balance conservation
    acceptance:
    - Every committed journal entry has total debits equal to total credits
    - A posting that would break the zero-sum rule is rejected with HTTP 422
  - id: REQ-002
    title: Idempotent entry API
    acceptance:
    - A repeated idempotency_key returns the original entry and creates no new postings
    - Concurrent requests with the same idempotency_key produce exactly one journal entry
  - id: REQ-003
    title: Operator ledger explorer
    acceptance:
    - Operators can drill down from an account balance to its journal legs
    - The explorer has zero accessibility findings
  - id: REQ-004
    title: Grounded anomaly explanations
    acceptance:
    - Every AI explanation cites only committed transaction IDs
    - Postings still commit when Vertex AI is unreachable
  invariants:
  - Every ledger write runs in a single Firestore transaction that also checks the zero-sum rule.
  - Money is stored as integer minor units; floating-point amounts are rejected in review.
  - All reads and writes go through the repository layer; handlers never call the Firestore client directly.
  - '`go test -race ./...` passes offline through the in-memory store, without Firestore.'
  decisions:
  - id: ADR-001
    title: Firestore as the system of record
    status: Accepted
    requirements:
    - REQ-001
    context: The ledger needs atomic multi-document writes and no idle infrastructure cost.
    decision: Store accounts, journal entries, and postings in Firestore (Native mode); write each journal entry
      and its postings in one transaction, with postings in a subcollection of the entry.
    consequences: Posting is atomic and serverless; one journal entry is limited to 500 document writes, and balance
      reads use per-account running totals updated in the same transaction.
  - id: ADR-002
    title: Idempotency keys stored with the journal entry
    status: Accepted
    requirements:
    - REQ-002
    context: Clients retry on timeouts, which must never double-post.
    decision: Use the idempotency key as the journal entry document ID, and return the existing entry when the transaction
      finds it.
    consequences: Retries are safe; keys must be retained for the audit period.
  glossary:
  - term: Journal entry
    definition: One business transaction, made of two or more postings that sum to zero.
  - term: Posting
    definition: A single debit or credit to one account, in minor units.
stack:
  primary_language: go
  framework: net/http + Firestore
  build_command: go build -buildvcs=false ./...
  test_command: go test -race ./...
  lint_command: go vet ./...
  port: 8080
infrastructure:
  cloud_stores:
  - firestore
  - bigquery
  serving_service: pulse-ledger-serving
  eval_service: pulse-ledger-eval-dashboard
  budget_usd: 200
  deployer_iam_roles:
  - roles/run.admin
  - roles/cloudbuild.builds.editor
  - roles/datastore.indexAdmin
  - roles/bigquery.dataEditor
  - roles/aiplatform.user
team:
  heartbeat_mode: direct-lead
  heartbeat_cron: '*/15 * * * *'
  watchdog_cron: '*/5 * * * *'
  max_wip: 2
  build_roles:
  - role: lead
    harness: claude
    model: opus
    responsibility: Triages ledger issues, coordinates specialists, verifies double-entry invariants on live Cloud
      Run
  - role: backend
    harness: opencode
    model: google-vertex/gemini-4-argon
    responsibility: Implements Go ledger handlers, Firestore transactions, and idempotency keys
  - role: frontend
    harness: antigravity
    model: Gemini 4 Argon (High)
    responsibility: Builds operator audit console and reconciliation ledger explorer
  - role: reviewer
    harness: hermes
    model: google/gemini-4-argon
    responsibility: Reviews diffs for ACID transaction safety, race conditions, and test coverage
  - role: deployer
    harness: claude
    model: opus
    gcp_identity: deployer-sa
    responsibility: Applies Firestore index changes and deploys clean git archives to Cloud Run with --to-latest
  eval_roles:
  - role: eval-lead
    harness: antigravity
    model: Gemini 4 Argon (High)
    responsibility: Coordinates continuous L1-L5 ledger verification sweeps and dashboard updates
  - role: domain-evaluator
    harness: antigravity
    model: Gemini 4 Argon (High)
    responsibility: Runs synthetic double-entry transfers, replay attacks, and anomaly probes against live API
  - role: factory-analyst
    harness: antigravity
    model: Gemini 4 Argon (High)
    responsibility: Monitors agent throughput, Cloud Trace waterfalls, and Firestore status sync
  - role: ui-craftsman
    harness: antigravity
    model: Gemini 4 Argon (High)
    responsibility: Maintains the evaluation control tower UI and passes zero-finding accessibility checks
  - role: eval-deployer
    harness: antigravity
    model: Gemini 4 Argon (High)
    gcp_identity: deployer-sa
    responsibility: Deploys the evaluation dashboard from the disjoint eval-dashboard orphan branch
evaluation_pyramid:
  l1_health:
    endpoint: /health
    checks:
    - HTTP 200 status and Firestore reachable
  l2_contract:
    endpoints:
    - POST /api/v1/entries
    - GET /api/v1/accounts/{id}/balance
    invariants:
    - Sum of debits equals sum of credits across every committed transaction
    - Duplicate idempotency_key returns original transaction without double-posting
  l3_domain_quality:
    primary_metric: reconciliation_accuracy
    target_threshold: 0.999
    secondary_metric: anomaly_f1_score
    secondary_threshold: 0.95
    probe_description: Execute 200 synthetic multi-leg journal entries and 25 injected fraud patterns; measure ledger
      balance conservation and anomaly F1.
  l4_safety_grounding:
    invariants:
    - AI audit explanations cite only committed transaction IDs from Firestore
    - Fail-closed fallback when Vertex AI is unreachable (transactions still commit deterministically)
  l5_latency_slo:
    p50_ms: 45
    p95_ms: 120
    p99_ms: 250
waves:
- wave: 1
  title: Core Double-Entry Schema & Idempotent Posting
  issues:
  - title: 'Wave 1.1: Firestore data model for accounts, journal entries, and postings with zero-sum check'
    owner_role: backend
    acceptance_criteria:
    - Index config deploys cleanly and unit tests verify the debit == credit invariant
    requirements:
    - REQ-001
  - title: 'Wave 1.2: Idempotent POST /api/v1/entries endpoint with replay protection'
    owner_role: backend
    acceptance_criteria:
    - Concurrent requests with identical idempotency_key produce exactly one journal entry
    requirements:
    - REQ-002
- wave: 2
  title: Operator Audit Console & AI Anomaly Explainer
  issues:
  - title: 'Wave 2.1: Ledger explorer UI with account balance drilldown'
    owner_role: frontend
    acceptance_criteria:
    - Renders live account balances and journal legs with zero accessibility findings
    requirements:
    - REQ-003
